<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-labelledby="phPortraitTitle phPortraitDesc">
  <title id="phPortraitTitle">Espaço reservado para a fotografia profissional</title>
